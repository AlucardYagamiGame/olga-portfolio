<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      name="description"
      content="Olga Shcherbatiuk, full stack developer (TypeScript, React). Scalable React and TypeScript web apps with a serverless Supabase backend, focused on code quality, performance and accessibility."
    />
    <meta
      name="theme-color"
      content="#0d0c11"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Inter:wght@300..600&display=swap"
    />
    <title>Olga Shcherbatiuk | Full Stack Developer</title>
    <script>
      (function () {
        var theme;
        try {
          theme = localStorage.getItem('olga-portfolio-theme');
        } catch (error) {
          theme = null;
        }
        if (theme !== 'light' && theme !== 'dark') {
          theme =
            window.matchMedia('(prefers-color-scheme: light)').matches ?
              'light'
            : 'dark';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
