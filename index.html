<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      name="description"
      content="Olha Shcherbatiuk, full stack developer (TypeScript, React). Scalable React and TypeScript web apps with a serverless Supabase backend, focused on code quality, performance and accessibility."
    />
    <meta
      name="theme-color"
      content="#0d0c11"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />
    <link
      rel="preload"
      href="/fonts/dm-sans-latin-opsz-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/inter-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Olha Shcherbatiuk | Full Stack Developer</title>
    <script>
      (function () {
        var theme;
        try {
          theme = localStorage.getItem('olga-portfolio-theme');
        } catch (error) {
          theme = null;
        }
        if (theme !== 'light' && theme !== 'dark') {
          theme =
            window.matchMedia('(prefers-color-scheme: light)').matches ?
              'light'
            : 'dark';
        }
        document.documentElement.dataset.theme = theme;

        // Start fetching the hero portrait for this theme before the app
        // script runs. Keep the sizes in sync with PORTRAIT_SIZES.
        var preload = document.createElement('link');
        preload.rel = 'preload';
        preload.as = 'image';
        preload.href = '/portrait/' + theme + '-800.webp';
        preload.setAttribute(
          'imagesrcset',
          '/portrait/' +
            theme +
            '-480.webp 480w, /portrait/' +
            theme +
            '-800.webp 800w',
        );
        preload.setAttribute('imagesizes', '(max-width: 639px) 80vw, 640px');
        document.head.appendChild(preload);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
